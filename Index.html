<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday 🎉</title>

<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  background: linear-gradient(135deg, #fff1f3, #ffe0e2);
  overflow: hidden;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: red;
  font-size: 20px;
  animation: float 5s linear infinite;
}
@keyframes float {
  0% {transform: translateY(100vh);}
  100% {transform: translateY(-10vh);}
}

/* Main box */
.container {
  margin-top: 80px;
  padding: 20px;
}

h1 {
  font-size: 2.5em;
  color: #ff2e63;
}

p {
  font-size: 1.2em;
  color: #333;
}

/* Button */
button {
  margin-top: 20px;
  padding: 12px 25px;
  font-size: 16px;
  border: none;
  border-radius: 25px;
  background: #ff2e63;
  color: white;
  cursor: pointer;
  transition: 0.3s;
}
button:hover {
  background: #e91e63;
}

/* Hidden message */
#surprise {
  display: none;
  margin-top: 20px;
  font-size: 1.3em;
  color: #000;
}
</style>
</head>

<body>

<div class="container">
  <h1>Happy Birthday 🎂</h1>
  <p>Dear <b id="name">Your Name</b>,</p>
  <p>Wishing you a day filled with happiness, love and surprises 💖</p>

  <button onclick="showSurprise()">Click for Surprise 🎁</button>

  <div id="surprise">
    🎉 You are the most special person in my life 💕  
    Stay happy always 😊
  </div>
</div>

<!-- Music -->
<audio id="music" autoplay loop>
  <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
</audio>

<script>
// Change name dynamically
document.getElementById("name").innerText = "Ammudha";

// Surprise button
function showSurprise() {
  document.getElementById("surprise").style.display = "block";
}

// Floating hearts
function createHeart() {
  const heart = document.createElement("div");
  heart.classList.add("heart");
  heart.innerHTML = "❤️";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 20 + 10 + "px";
  document.body.appendChild(heart);

  setTimeout(() => {
    heart.remove();
  }, 5000);
}
setInterval(createHeart, 300);
</script>

</body>
</html>
