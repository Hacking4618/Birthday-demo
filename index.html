<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:'Poppins',sans-serif;
  background:black;
  color:white;
  overflow:hidden;
}

/* Section Base */
.section{
  position:absolute;
  width:100%;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  flex-direction:column;
  text-align:center;
  padding:20px;
  transition:1.2s ease;
}

/* DARK INTRO (Apology style look) */
#intro{
  background:linear-gradient(135deg, #000000, #1c1c1c, #3e2c23);
}

/* GLASS EFFECT */
.glass{
  backdrop-filter: blur(10px);
  background: rgba(255,255,255,0.05);
  padding:25px;
  border-radius:20px;
}

/* BUTTON */
button{
  margin-top:20px;
  padding:12px 28px;
  border:none;
  border-radius:30px;
  background:#6b4f3b;
  color:white;
  cursor:pointer;
}

/* BIRTHDAY SECTION */
#birthday{
  background:linear-gradient(135deg,#f5f0e6,#d2b48c,#3e2c23);
  color:#3e2c23;
  transform:translateY(100%);
}

/* HEADINGS */
h1{
  font-family:'Playfair Display',serif;
  font-size:3rem;
}

p{
  margin-top:10px;
}

/* FADE ANIMATION */
.fade{
  opacity:0;
  transform:translateY(20px);
  transition:1s;
}
.show{
  opacity:1;
  transform:translateY(0);
}

/* GALLERY */
.gallery{
  display:flex;
  gap:10px;
  overflow-x:auto;
  margin-top:20px;
}
.gallery img{
  height:180px;
  border-radius:15px;
}

/* HEARTS */
.heart{
  position:fixed;
  bottom:-10px;
  font-size:18px;
  animation:float 5s linear infinite;
}
@keyframes float{
  to{
    transform:translateY(-100vh);
    opacity:0;
  }
}

/* CONFETTI */
.confetti{
  position:fixed;
  width:8px;
  height:8px;
  background:#6b4f3b;
  top:-10px;
  animation:fall 4s linear infinite;
}
@keyframes fall{
  to{ transform:translateY(100vh); }
}

</style>
</head>

<body>

<!-- 🎬 DARK INTRO -->
<div id="intro" class="section">
  <div class="glass">
    <h2 class="fade">Close your eyes for a second...</h2>
    <h2 class="fade">This is something special for you ❤️</h2>
    <button onclick="start()">Tap to Open</button>
  </div>
</div>

<!-- 🎂 BIRTHDAY -->
<div id="birthday" class="section">
  <h1 class="fade" id="nameText">Happy Birthday ❤️</h1>
  <p class="fade">A day made just for you ✨</p>

  <div class="gallery fade">
    <img src="https://via.placeholder.com/200">
    <img src="https://via.placeholder.com/200">
    <img src="https://via.placeholder.com/200">
  </div>

  <p class="fade">You deserve everything beautiful 💖</p>
</div>

<!-- MUSIC -->
<audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

<script>

// fade intro text
setTimeout(()=>{
  document.querySelectorAll("#intro .fade").forEach(el=>{
    el.classList.add("show");
  });
},500);

// start transition
function start(){
  document.getElementById("music").play();

  // slide up effect
  document.getElementById("birthday").style.transform = "translateY(0)";

  setTimeout(()=>{
    document.getElementById("intro").style.opacity="0";
  },300);

  setTimeout(()=>{
    document.getElementById("intro").style.display="none";

    document.querySelectorAll("#birthday .fade").forEach(el=>{
      el.classList.add("show");
    });

    startEffects();
  },1000);
}

// effects
function startEffects(){

  // hearts
  setInterval(()=>{
    let h=document.createElement("div");
    h.className="heart";
    h.innerHTML="❤️";
    h.style.left=Math.random()*100+"vw";
    document.body.appendChild(h);
    setTimeout(()=>h.remove(),5000);
  },300);

  // confetti
  for(let i=0;i<40;i++){
    let c=document.createElement("div");
    c.className="confetti";
    c.style.left=Math.random()*100+"vw";
    c.style.animationDuration=(Math.random()*3+2)+"s";
    document.body.appendChild(c);
  }
}

// name input
let name=prompt("Enter Name:");
if(name){
  document.getElementById("nameText").innerText="Happy Birthday "+name+" ❤️";
}

</script>

</body>
</html>
