<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ❤️</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&family=Poppins:wght@300&display=swap" rel="stylesheet">

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  overflow-x: hidden;
  background: black;
  color: white;
}

/* Sections */
.section {
  height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  flex-direction: column;
  text-align: center;
  padding: 20px;
}

/* Intro (Luxury Feel) */
#intro {
  background: linear-gradient(135deg, black, #3e2c23);
}

button {
  padding: 12px 25px;
  background: #6b4f3b;
  color: white;
  border: none;
  border-radius: 25px;
  cursor: pointer;
}

/* Birthday Section */
#birthday {
  display: none;
  background: linear-gradient(135deg, #f5f0e6, #d2b48c, #3e2c23);
  color: #3e2c23;
}

h1 {
  font-family: 'Playfair Display', serif;
  font-size: 2.8rem;
}

/* Gallery */
.gallery {
  display: flex;
  overflow-x: auto;
  gap: 10px;
  margin-top: 20px;
}

.gallery img {
  height: 200px;
  border-radius: 15px;
}

/* Floating hearts */
.heart {
  position: fixed;
  bottom: -10px;
  font-size: 20px;
  animation: float 5s linear infinite;
}

@keyframes float {
  to {
    transform: translateY(-100vh);
    opacity: 0;
  }
}

/* Fade animation */
.fade {
  opacity: 0;
  transition: 1s;
}
.show {
  opacity: 1;
}
</style>
</head>

<body>

<!-- 🎬 Intro -->
<div id="intro" class="section">
  <h2 class="fade">Today is not just another day...</h2>
  <h2 class="fade">It’s about someone special ❤️</h2>

  <button onclick="startBirthday()">Tap to Continue</button>
</div>

<!-- 🎂 Birthday -->
<div id="birthday" class="section">
  <h1 class="fade" id="nameText">Happy Birthday ❤️</h1>
  <p class="fade">May your day be filled with love, smiles, and happiness.</p>

  <!-- Gallery -->
  <div class="gallery fade">
    <img src="https://via.placeholder.com/200">
    <img src="https://via.placeholder.com/200">
    <img src="https://via.placeholder.com/200">
  </div>

  <p class="fade">You are truly special 💖</p>
</div>

<!-- 🎵 Music -->
<audio id="music" src="https://www.bensound.com/bensound-music/bensound-romantic.mp3"></audio>

<script>

// Show intro text smoothly
setTimeout(() => {
  document.querySelectorAll("#intro .fade").forEach(el => el.classList.add("show"));
}, 500);

// Start Birthday
function startBirthday() {
  document.getElementById("music").play();

  document.getElementById("intro").style.display = "none";
  document.getElementById("birthday").style.display = "flex";

  setTimeout(() => {
    document.querySelectorAll("#birthday .fade").forEach(el => el.classList.add("show"));
  }, 500);

  startHearts();
}

// Floating hearts
function startHearts() {
  setInterval(() => {
    let heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 5000);
  }, 300);
}

// Custom Name
let name = prompt("Enter Name:");
if(name){
  document.getElementById("nameText").innerText = "Happy Birthday " + name + " ❤️";
}

</script>

</body>
</html>
