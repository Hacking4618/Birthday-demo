<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You ❤️</title>

<style>
body {
  margin: 0;
  font-family: 'Poppins', sans-serif;
  background: black;
  color: white;
  text-align: center;
  overflow-x: hidden;
}

/* Sections */
.section {
  height: 100vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  transition: 1s;
}

/* Apology Section */
#apology {
  background: black;
}

button {
  padding: 12px 25px;
  border: none;
  background: #6b4f3b;
  color: white;
  font-size: 16px;
  border-radius: 25px;
  cursor: pointer;
  margin-top: 20px;
}

/* Birthday Section */
#birthday {
  display: none;
  background: linear-gradient(135deg, #f5f0e6, #d2b48c, #3e2c23);
  color: #3e2c23;
}

h1 {
  font-size: 2.5rem;
}

.fade {
  opacity: 0;
  transition: 1s;
}

.show {
  opacity: 1;
}

/* Confetti */
.confetti {
  position: fixed;
  width: 10px;
  height: 10px;
  background: white;
  top: -10px;
  animation: fall 5s linear infinite;
}

@keyframes fall {
  to {
    transform: translateY(100vh);
  }
}
</style>
</head>

<body>

<!-- 💔 Apology Section -->
<div id="apology" class="section">
  <h2 id="text1"></h2>
  <h2 id="text2"></h2>
  <h2 id="text3"></h2>

  <button onclick="showBirthday()">Please Click...</button>
</div>

<!-- 🎂 Birthday Section -->
<div id="birthday" class="section">
  <h1 class="fade" id="bdayText">Happy Birthday ❤️</h1>
  <p class="fade">Even if I messed up… today is all about you.</p>
</div>

<script>
// Typing Effect
const lines = [
  "I know I hurt you...",
  "I didn’t mean to lose you...",
  "I’m really sorry..."
];

let i = 0;
function typeLine() {
  if (i < lines.length) {
    document.getElementById("text" + (i+1)).innerHTML = lines[i];
    i++;
    setTimeout(typeLine, 1500);
  }
}
typeLine();

// Show Birthday Section
function showBirthday() {
  document.getElementById("apology").style.display = "none";
  document.getElementById("birthday").style.display = "flex";

  setTimeout(() => {
    document.querySelectorAll(".fade").forEach(el => {
      el.classList.add("show");
    });
  }, 500);

  startConfetti();
}

// Confetti Effect
function startConfetti() {
  for (let i = 0; i < 50; i++) {
    let div = document.createElement("div");
    div.classList.add("confetti");
    div.style.left = Math.random() * 100 + "vw";
    div.style.animationDuration = (Math.random() * 3 + 2) + "s";
    document.body.appendChild(div);
  }
}
</script>

</body>
</html>
